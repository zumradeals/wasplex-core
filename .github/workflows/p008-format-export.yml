name: p008-format-export

on:
  push:
    branches:
      - codex/p008-smart-profile-matching

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Apply Pint
        run: vendor/bin/pint app/Modules/Advertising/Application/Services/AdvertisingProfileService.php

      - name: Upload exact service
        uses: actions/upload-artifact@v4
        with:
          name: p008-profile-service-pint
          path: apps/platform/app/Modules/Advertising/Application/Services/AdvertisingProfileService.php
          retention-days: 1
