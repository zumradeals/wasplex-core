name: ci

on:
  push:
    branches:
      - feat/p014-d-fonds-collecte-automatique

permissions:
  contents: write

jobs:
  finalize-p014-d:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wasplex_test
          POSTGRES_USER: wasplex
          POSTGRES_PASSWORD: wasplex_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wasplex -d wasplex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_pgsql, redis
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json

      - name: Install dependencies
        working-directory: apps/platform
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Wire P014-D surfaces and parameters
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('apps/platform/resources/js/Components/AdminFundsPanel.vue')
          s = p.read_text()
          if "AdminFundCollections from '@/Components/AdminFundCollections.vue'" not in s:
              s = s.replace("import AdminFundPartnerQuotes from '@/Components/AdminFundPartnerQuotes.vue';\n", "import AdminFundPartnerQuotes from '@/Components/AdminFundPartnerQuotes.vue';\nimport AdminFundCollections from '@/Components/AdminFundCollections.vue';\n")
          s = s.replace("    grace_period_days: number;\n};", "    grace_period_days: number;\n    arrears_grace_days: number;\n    max_simultaneous_collections: number;\n};")
          if 'arrears_grace_days: 7' not in s.split('const categoryForm')[0]:
              s = s.replace("    grace_period_days: 7,\n});", "    grace_period_days: 7,\n    arrears_grace_days: 7,\n    max_simultaneous_collections: 1,\n});", 1)
          reset_block = "        grace_period_days: 7,\n    };"
          if reset_block in s:
              s = s.replace(reset_block, "        grace_period_days: 7,\n        arrears_grace_days: 7,\n        max_simultaneous_collections: 1,\n    };", 1)
          if 'arrears_grace_days: programForm.value.arrears_grace_days' not in s:
              s = s.replace("            grace_period_days: programForm.value.grace_period_days,\n        });", "            grace_period_days: programForm.value.grace_period_days,\n            arrears_grace_days: programForm.value.arrears_grace_days,\n            max_simultaneous_collections: programForm.value.max_simultaneous_collections,\n        });")
          if '<AdminFundCollections />' not in s:
              s = s.replace("            <AdminFundPartnerQuotes />\n", "            <AdminFundPartnerQuotes />\n\n            <AdminFundCollections />\n")
          marker = '''                        <label class="text-wpx-muted-dark text-xs"\n                            >Délai de grâce (jours)<input\n                                v-model.number="programForm.grace_period_days"\n                                type="number"\n                                min="1"\n                                class="bg-wpx-navy-850 border-wpx-border-dark text-wpx-white-soft mt-1 w-full rounded-xl border px-3 py-3"\n                        /></label>\n'''
          extra = '''                        <label class="text-wpx-muted-dark text-xs"\n                            >Grâce arriérés (jours)<input\n                                v-model.number="programForm.arrears_grace_days"\n                                type="number"\n                                min="1"\n                                class="bg-wpx-navy-850 border-wpx-border-dark text-wpx-white-soft mt-1 w-full rounded-xl border px-3 py-3"\n                        /></label>\n                        <label class="text-wpx-muted-dark text-xs"\n                            >Collectes simultanées<input\n                                v-model.number="programForm.max_simultaneous_collections"\n                                type="number"\n                                min="1"\n                                class="bg-wpx-navy-850 border-wpx-border-dark text-wpx-white-soft mt-1 w-full rounded-xl border px-3 py-3"\n                        /></label>\n'''
          if 'programForm.arrears_grace_days' not in s[s.find('<template>'):]:
              s = s.replace(marker, marker + extra, 1)
          p.write_text(s)

          p = Path('apps/platform/resources/js/Components/FundBalanceCard.vue')
          s = p.read_text()
          if "FundCollectionStatusCard from '@/Components/FundCollectionStatusCard.vue'" not in s:
              s = s.replace("import http from '@/lib/http';\n", "import http from '@/lib/http';\nimport FundCollectionStatusCard from '@/Components/FundCollectionStatusCard.vue';\n")
          if '<FundCollectionStatusCard />' not in s:
              s = s.replace("    </section>\n</template>\n", "    </section>\n\n    <FundCollectionStatusCard />\n</template>\n")
          p.write_text(s)
          PY

      - name: Normalize source
        working-directory: apps/platform
        run: |
          npx prettier --write resources/js/Components/AdminFundCollections.vue resources/js/Components/FundCollectionStatusCard.vue resources/js/Components/AdminFundsPanel.vue resources/js/Components/FundBalanceCard.vue
          ./vendor/bin/pint app/Modules/Funds tests/Feature/Funds/FundsAutomaticCollectionTest.php

      - name: Validate P014-D strictly
        working-directory: apps/platform
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: wasplex_test
          DB_USERNAME: wasplex
          DB_PASSWORD: wasplex_ci_only
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: |
          npm run format:check
          npm run lint:check
          npm run types:check
          npm run build
          composer lint:check
          composer test

      - name: Restore strict repository CI
        run: git checkout origin/main -- .github/workflows/ci.yml

      - name: Commit finalized P014-D
        run: |
          git config user.name "zumradeals"
          git config user.email "zumradeals@gmail.com"
          git add .github/workflows/ci.yml apps/platform/app/Modules/Funds apps/platform/resources/js/Components/AdminFundCollections.vue apps/platform/resources/js/Components/FundCollectionStatusCard.vue apps/platform/resources/js/Components/AdminFundsPanel.vue apps/platform/resources/js/Components/FundBalanceCard.vue apps/platform/tests/Feature/Funds/FundsAutomaticCollectionTest.php
          git diff --cached --quiet && exit 0
          git commit -m "feat(funds): finaliser P014-D collecte automatique"
          git push origin HEAD:feat/p014-d-fonds-collecte-automatique
