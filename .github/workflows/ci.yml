name: ci

on:
  pull_request:

permissions:
  contents: write

jobs:
  platform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform

    steps:
      - name: Checkout P008 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/p008-smart-profile-matching
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Apply exact P008 frontend formatting
        run: >-
          npx prettier --write
          resources/js/pages/Studio/CampaignTargeting.vue
          resources/js/pages/User/AdvertisingExplanation.vue

      - name: Commit formatting only
        working-directory: .
        run: |
          git config user.name "wasplex-ci"
          git config user.email "actions@users.noreply.github.com"
          git add apps/platform/resources/js/pages/Studio/CampaignTargeting.vue
          git add apps/platform/resources/js/pages/User/AdvertisingExplanation.vue
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "style(advertising): format targeting and explanation pages"
          git push origin HEAD:codex/p008-smart-profile-matching
