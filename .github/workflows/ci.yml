name: ci

on:
  pull_request:

permissions:
  contents: write

jobs:
  platform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Apply canonical formatting and restore CI
        run: |
          npm run format
          git fetch origin main:refs/remotes/origin/main
          git checkout origin/main -- ../../.github/workflows/ci.yml
          git add \
            resources/js/Components/AdminLiveRewardsPanel.vue \
            resources/js/Components/LiveInteractionsPanel.vue \
            resources/js/Pages/Identity/AdminShell.vue \
            ../../.github/workflows/ci.yml
          if git diff --cached --quiet; then
            echo "Nothing to format."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(P018-F): format frontend and restore CI"
          git push origin HEAD:${{ github.head_ref }}
