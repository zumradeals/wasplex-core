name: ci

on:
  pull_request:

permissions:
  contents: write

jobs:
  platform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/p004b-economic-admin-ui
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/platform
        run: npm ci

      - name: Apply Inertia payload typing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/platform/resources/js/pages/EconomicConfiguration/Admin.vue')
          content = path.read_text()

          old_import = "import { Head, Link, router, useForm } from '@inertiajs/vue3';"
          new_import = "import type { RequestPayload } from '@inertiajs/core';\nimport { Head, Link, router, useForm } from '@inertiajs/vue3';"
          old_signature = "const runAction = (key: string, url: string, data: Record<string, unknown> = {}) => {"
          new_signature = "const runAction = (key: string, url: string, data: RequestPayload = {}) => {"

          if old_import not in content or old_signature not in content:
              raise SystemExit('Expected P004-B TypeScript patterns were not found.')

          content = content.replace(old_import, new_import, 1)
          content = content.replace(old_signature, new_signature, 1)
          path.write_text(content)
          PY

      - name: Format and validate frontend
        working-directory: apps/platform
        run: |
          npm run format
          npm run lint
          npm run types:check
          npm run build

      - name: Commit verified TypeScript fix
        run: |
          git config user.name "wasplex-ci"
          git config user.email "actions@users.noreply.github.com"
          git add apps/platform/resources/js/pages/EconomicConfiguration/Admin.vue
          if ! git diff --cached --quiet; then
            git commit -m "fix(economy): type Inertia action payloads"
            git push origin HEAD:codex/p004b-economic-admin-ui
          fi
