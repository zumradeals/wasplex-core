name: ci

on:
  pull_request:

permissions:
  contents: write

jobs:
  platform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform

    steps:
      - name: Checkout P008 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/p008-smart-profile-matching
          persist-credentials: true

      - name: Rename estimate action
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('resources/js/pages/Studio/CampaignTargeting.vue')
          content = path.read_text()
          content = content.replace('const estimate = () => {', 'const requestEstimate = () => {')
          content = content.replace('@click="estimate"', '@click="requestEstimate"')
          path.write_text(content)
          PY

      - name: Commit TypeScript fix only
        working-directory: .
        run: |
          git config user.name "wasplex-ci"
          git config user.email "actions@users.noreply.github.com"
          git add apps/platform/resources/js/pages/Studio/CampaignTargeting.vue
          if git diff --cached --quiet; then
            echo "No TypeScript symbol change required."
            exit 0
          fi
          git commit -m "fix(advertising): avoid estimate prop shadowing"
          git push origin HEAD:codex/p008-smart-profile-matching
