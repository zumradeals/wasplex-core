name: ci

on:
  pull_request:

permissions:
  contents: write

jobs:
  platform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/p005-advertiser-studio-brand-wallet
          persist-credentials: true

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        working-directory: apps/platform
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Format PHP
        working-directory: apps/platform
        run: composer lint

      - name: Commit verified PHP formatting
        run: |
          git config user.name "wasplex-ci"
          git config user.email "actions@users.noreply.github.com"
          git add apps/platform
          if ! git diff --cached --quiet; then
            git commit -m "style(studio): apply verified Pint formatting"
            git push origin HEAD:codex/p005-advertiser-studio-brand-wallet
          fi
