name: ci

on:
  pull_request:

permissions:
  contents: write

jobs:
  platform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refactor/admin-economic-model
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Format Admin subscriptions panel
        run: npx prettier --write resources/js/Components/AdminSubscriptionsPanel.vue

      - name: Commit formatted file
        working-directory: .
        run: |
          if git diff --quiet -- apps/platform/resources/js/Components/AdminSubscriptionsPanel.vue; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/platform/resources/js/Components/AdminSubscriptionsPanel.vue
          git commit -m "style(admin): formater le modèle économique"
          git push origin HEAD:refactor/admin-economic-model
