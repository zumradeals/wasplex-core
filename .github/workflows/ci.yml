name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  platform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Format SmartProfile page
        run: npx prettier --write resources/js/pages/User/AdvertisingProfile.vue

      - name: Upload exact SmartProfile page
        uses: actions/upload-artifact@v4
        with:
          name: p008-smartprofile-prettier
          path: apps/platform/resources/js/pages/User/AdvertisingProfile.vue
          retention-days: 1
