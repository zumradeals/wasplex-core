name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  platform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Diagnostic TypeScript P018-D
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node -e "const fs=require('fs'); const p='resources/js/Components/AdvertiserLivePanel.vue'; let s=fs.readFileSync(p,'utf8'); s=s.replace('        block_duration_seconds: number;\n        quoted_at: string | null;', '        block_duration_seconds: number;\n        rewarded_seat_capacity: number;\n        max_blocks_per_viewer: number;\n        funded_blocks: number;\n        reward_per_block_minor: number;\n        max_reward_per_viewer_minor: number;\n        spectator_envelope_remainder_minor: number;\n        quoted_at: string | null;'); s=s.replace('    can_schedule: boolean;\n}', '    can_schedule: boolean;\n    seat_runtime: {\n        active: number;\n        offered: number;\n        waiting: number;\n        available: number;\n    } | null;\n}'); fs.writeFileSync(p,s)"
          node -e "const fs=require('fs'); const p='resources/js/Components/LivePanel.vue'; let s=fs.readFileSync(p,'utf8'); s=s.replace('                            rewardSeat?.viewer.can_join_waitlist &&\n                            rewardSeat.viewer.status !== \'waiting\'\n', '                            rewardSeat?.viewer.can_join_waitlist\n'); fs.writeFileSync(p,s)"
          npx prettier --write resources/js/Components/AdvertiserLivePanel.vue resources/js/Components/LivePanel.vue
          make_blob() {
            local path="$1"
            local payload
            payload="$(node -e "const fs=require('fs'); console.log(JSON.stringify({content:fs.readFileSync(process.argv[1]).toString('base64'),encoding:'base64'}))" "$path")"
            curl -fsS -X POST -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs" -d "$payload" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).sha))"
          }
          echo "FIXED_ADVERTISER_LIVE_PANEL_SHA=$(make_blob resources/js/Components/AdvertiserLivePanel.vue)"
          echo "FIXED_LIVE_PANEL_SHA=$(make_blob resources/js/Components/LivePanel.vue)"
          npm run types:check
          exit 1
