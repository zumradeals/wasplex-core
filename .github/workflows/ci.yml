name: ci

on:
  pull_request:

permissions:
  contents: write

jobs:
  platform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Apply canonical PHP formatting and restore CI
        run: |
          vendor/bin/pint \
            app/Modules/Live/Application/Services/LiveRewardAttentionService.php \
            app/Modules/Live/Application/Services/LiveRewardHoldService.php \
            app/Modules/Live/Application/Services/LiveRewardRiskService.php \
            app/Modules/Live/Application/Services/LiveRewardSettlementService.php \
            app/Modules/Live/Http/Controllers/Admin/LiveRewardOperationsController.php \
            app/Modules/Live/Infrastructure/Models/LiveRewardAttentionBlock.php \
            app/Modules/Live/Infrastructure/Models/LiveRewardBudgetReservation.php \
            app/Modules/Live/Infrastructure/Models/LiveRewardHold.php \
            app/Modules/Live/Infrastructure/Models/LiveRewardRiskEvent.php \
            tests/Feature/Live/LiveRewardProductionControlsTest.php
          git fetch origin main:refs/remotes/origin/main
          git checkout origin/main -- ../../.github/workflows/ci.yml
          git add \
            app/Modules/Live/Application/Services/LiveRewardAttentionService.php \
            app/Modules/Live/Application/Services/LiveRewardHoldService.php \
            app/Modules/Live/Application/Services/LiveRewardRiskService.php \
            app/Modules/Live/Application/Services/LiveRewardSettlementService.php \
            app/Modules/Live/Http/Controllers/Admin/LiveRewardOperationsController.php \
            app/Modules/Live/Infrastructure/Models/LiveRewardAttentionBlock.php \
            app/Modules/Live/Infrastructure/Models/LiveRewardBudgetReservation.php \
            app/Modules/Live/Infrastructure/Models/LiveRewardHold.php \
            app/Modules/Live/Infrastructure/Models/LiveRewardRiskEvent.php \
            tests/Feature/Live/LiveRewardProductionControlsTest.php \
            ../../.github/workflows/ci.yml
          if git diff --cached --quiet; then
            echo "Nothing to format."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(P018-F): apply PHP formatting and restore CI"
          git push origin HEAD:${{ github.head_ref }}
