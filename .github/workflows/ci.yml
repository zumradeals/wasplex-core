name: ci

on:
  pull_request:

permissions:
  contents: write

jobs:
  platform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform

    steps:
      - name: Checkout P008 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/p008-smart-profile-matching
          persist-credentials: true

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Apply exact Matching formatting
        run: >-
          vendor/bin/pint
          app/Modules/Advertising/Application/Services/AdvertisingSegmentService.php
          app/Modules/Advertising/Application/Services/CampaignEligibilityService.php
          tests/Feature/Modules/Advertising/AdvertisingMatchingTest.php

      - name: Commit formatting only
        working-directory: .
        run: |
          git config user.name "wasplex-ci"
          git config user.email "actions@users.noreply.github.com"
          git add apps/platform/app/Modules/Advertising/Application/Services/AdvertisingSegmentService.php
          git add apps/platform/app/Modules/Advertising/Application/Services/CampaignEligibilityService.php
          git add apps/platform/tests/Feature/Modules/Advertising/AdvertisingMatchingTest.php
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "style(advertising): format protected matching core"
          git push origin HEAD:codex/p008-smart-profile-matching
