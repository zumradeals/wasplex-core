name: ci

on:
  pull_request:

permissions:
  contents: write

jobs:
  platform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform

    steps:
      - name: Checkout P008 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Apply exact SmartProfile formatting
        run: npx prettier --write resources/js/pages/User/AdvertisingProfile.vue

      - name: Commit formatting only
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/platform/resources/js/pages/User/AdvertisingProfile.vue
          if git diff --cached --quiet; then
            echo "No formatting change to commit."
            exit 0
          fi
          git commit -m "style(p008): format SmartProfile page"
          git push origin HEAD:${{ github.head_ref }}
