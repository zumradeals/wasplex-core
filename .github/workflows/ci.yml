name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  platform:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wasplex_test
          POSTGRES_USER: wasplex
          POSTGRES_PASSWORD: wasplex_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wasplex -d wasplex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/platform

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_pgsql, redis
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Instrument reward offer timestamps
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/Modules/Live/Application/Services/LiveRewardSeatService.php')
          s = p.read_text()
          needle = "    private function expireOffersUnderLock(LiveEvent $live, LiveRewardCampaign $campaign): void\n    {\n"
          insert = "    private function expireOffersUnderLock(LiveEvent $live, LiveRewardCampaign $campaign): void\n    {\n        foreach (LiveRewardWaitlistEntry::query()->where('live_id', $live->id)->where('status', LiveRewardWaitlistEntry::STATUS_OFFERED)->get() as $debugOffer) {\n            fwrite(STDERR, sprintf(\"OFFERDBG now=%s offered=%s expires=%s future=%s ttl=%s account=%s\\n\", now()->toIso8601String(), $debugOffer->offered_at?->toIso8601String() ?? 'null', $debugOffer->offer_expires_at?->toIso8601String() ?? 'null', $debugOffer->offer_expires_at?->isFuture() ? 'yes' : 'no', (string) config('live.reward_offer_seconds'), $debugOffer->account_id));\n        }\n"
          if needle not in s:
              raise SystemExit('needle not found')
          p.write_text(s.replace(needle, insert, 1))
          PY

      - name: Run P018-D reward-seat tests only
        run: php artisan test tests/Feature/Live/LiveRewardSeatsTest.php
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: wasplex_test
          DB_USERNAME: wasplex
          DB_PASSWORD: wasplex_ci_only
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
