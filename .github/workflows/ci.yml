name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  platform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_pgsql, redis
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Diagnostic Pint P018-D
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          vendor/bin/pint tests/Feature/Live/LiveRewardSeatsTest.php
          vendor/bin/pint --test tests/Feature/Live/LiveRewardSeatsTest.php
          payload="$(php -r '$p=$argv[1]; echo json_encode(["content"=>base64_encode(file_get_contents($p)),"encoding"=>"base64"]);' tests/Feature/Live/LiveRewardSeatsTest.php)"
          sha="$(curl -fsS -X POST -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs" -d "$payload" | php -r '$j=json_decode(stream_get_contents(STDIN), true); echo $j["sha"];')"
          echo "FIXED_LIVE_REWARD_SEATS_TEST_SHA=${sha}"
          exit 1
