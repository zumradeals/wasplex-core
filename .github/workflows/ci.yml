name: ci

on:
  pull_request:

permissions:
  contents: write

jobs:
  platform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/p005-advertiser-studio-brand-wallet
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/platform
        run: npm ci

      - name: Format and validate frontend
        working-directory: apps/platform
        run: |
          sed -i 's/^const props = defineProps</defineProps</' resources/js/pages/Studio/Brands.vue
          npm run format
          npm run lint:check
          npm run types:check
          npm run build

      - name: Commit verified frontend formatting
        run: |
          git config user.name "wasplex-ci"
          git config user.email "actions@users.noreply.github.com"
          git add apps/platform/resources
          if ! git diff --cached --quiet; then
            git commit -m "style(studio): format and validate P005 interface"
            git push origin HEAD:codex/p005-advertiser-studio-brand-wallet
          fi
