name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  platform:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wasplex_test
          POSTGRES_USER: wasplex
          POSTGRES_PASSWORD: wasplex_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wasplex -d wasplex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/platform

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_pgsql, pdo_sqlite, redis
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test environment
        run: cp .env.example .env

      - name: Install frontend dependencies
        run: npm ci

      - name: Check PHP formatting
        run: composer lint:check

      - name: Run PHP static analysis
        run: composer types:check

      - name: Run PHP tests
        run: composer test

      - name: Run PHP tests on PostgreSQL 17
        run: composer test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: wasplex_test
          DB_USERNAME: wasplex
          DB_PASSWORD: wasplex_ci_only

      - name: Format P008-R frontend files
        run: >-
          npx prettier --write
          resources/js/layouts/AdminLayout.vue
          resources/js/pages/Admin/AdvertisingCatalog.vue
          resources/js/pages/User/AdvertisingProfile.vue

      - name: Commit exact P008-R formatting
        working-directory: .
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          git config user.name "wasplex-ci"
          git config user.email "actions@users.noreply.github.com"
          git add \
            apps/platform/resources/js/layouts/AdminLayout.vue \
            apps/platform/resources/js/pages/Admin/AdvertisingCatalog.vue \
            apps/platform/resources/js/pages/User/AdvertisingProfile.vue
          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
          else
            git commit -m "style(frontend): apply Prettier to P008-R interfaces"
            git push origin "HEAD:${BRANCH_NAME}"
          fi

      - name: Check frontend formatting
        run: npm run format:check

      - name: Run frontend lint
        run: npm run lint:check

      - name: Run frontend type checks
        run: npm run types:check

      - name: Build frontend
        run: npm run build
