name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  platform:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wasplex_test
          POSTGRES_USER: wasplex
          POSTGRES_PASSWORD: wasplex_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wasplex -d wasplex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/platform

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_pgsql, redis
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Install frontend dependencies
        run: npm ci

      - name: Fix obsolete prop and format changed code
        run: |
          sed -i '/const props = withDefaults(defineProps/d' resources/js/Components/SmartProfilePanel.vue
          npm run format
          composer lint

      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            app/Modules/SmartProfile/Application/Services/ProfileAnswerService.php \
            app/Modules/SmartProfile/Application/Services/ProfileTargetingService.php \
            app/Modules/SmartProfile/Application/Services/ProfileTaxonomyService.php \
            app/Modules/SmartProfile/Console/SeedCatalogCommand.php \
            app/Modules/SmartProfile/Database/Migrations/2026_08_11_010000_add_facets_and_input_types_to_profile_taxonomies.php \
            app/Modules/SmartProfile/Http/Controllers/Admin/ProfileTaxonomiesController.php \
            app/Modules/SmartProfile/Http/Controllers/User/ProfileController.php \
            app/Modules/SmartProfile/Http/routes/api.php \
            app/Modules/SmartProfile/Infrastructure/Models/ProfileTaxonomy.php \
            resources/js/Components/SmartProfilePanel.vue \
            resources/js/Components/SubscriptionPanel.vue \
            tests/Feature/SmartProfile/ProfileTargetingFacetTest.php
          if ! git diff --cached --quiet; then
            git commit -m "fix: remove obsolete smart profile prop"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Check frontend formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint:check

      - name: Check Vue/TypeScript types
        run: npm run types:check

      - name: Build frontend assets
        run: npm run build

      - name: Check PHP formatting
        run: composer lint:check

      - name: Run PHP tests against PostgreSQL and Redis
        run: composer test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: wasplex_test
          DB_USERNAME: wasplex
          DB_PASSWORD: wasplex_ci_only
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379

      # TODO(P001+): réactiver "composer types:check" (Larastan/PHPStan)
      # dès que le paquet larastan/larastan est ajouté à composer.json depuis
      # un poste disposant d'un accès réseau complet à GitHub — voir le
      # rapport P000 pour le détail du blocage réseau rencontré en sandbox.
