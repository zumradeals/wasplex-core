name: ci

on:
  pull_request:

permissions:
  contents: write

jobs:
  platform:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/p006-campaign-quote-budget
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/platform
        run: npm ci

      - name: Fix and validate frontend typing
        working-directory: apps/platform
        run: |
          sed -i 's/let autosaveTimer: ReturnType<typeof setTimeout> | null = null;/let autosaveTimer: number | null = null;/' resources/js/pages/Studio/CampaignWizard.vue
          npm run format:check
          npm run lint:check
          npm run types:check
          npm run build

      - name: Commit verified typing fix
        run: |
          git config user.name "wasplex-ci"
          git config user.email "actions@users.noreply.github.com"
          git add apps/platform/resources/js/pages/Studio/CampaignWizard.vue
          if ! git diff --cached --quiet; then
            git commit -m "fix(campaign): type browser autosave timer"
            git push origin HEAD:codex/p006-campaign-quote-budget
          fi
