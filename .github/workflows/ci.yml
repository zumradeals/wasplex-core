name: ci

on:
  pull_request:

permissions:
  contents: write

jobs:
  platform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform

    steps:
      - name: Checkout P008 branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: codex/p008-smart-profile-matching
          persist-credentials: true

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Apply deterministic window and stronger tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          service = Path('app/Modules/Advertising/Application/Services/CampaignEligibilityService.php')
          content = service.read_text()
          old = """        return [
              'impressions' => 0,
              'limit' => max(1, (int) config('advertising.frequency_limit', 3)),
              'fatigueScore' => 0,
              'fatigueLimit' => max(1, (int) config('advertising.fatigue_limit', 100)),
              'windowStart' => $now->copy()->subHours($hours)->toIso8601String(),
              'windowEnd' => $now->copy()->addHours($hours)->toIso8601String(),
          ];
"""
          new = """        $windowSeconds = $hours * 3600;
          $windowStartTimestamp = intdiv($now->timestamp, $windowSeconds) * $windowSeconds;
          $windowStart = $now->copy()->setTimestamp($windowStartTimestamp)->utc();
          $windowEnd = $windowStart->copy()->addSeconds($windowSeconds);

          return [
              'impressions' => 0,
              'limit' => max(1, (int) config('advertising.frequency_limit', 3)),
              'fatigueScore' => 0,
              'fatigueLimit' => max(1, (int) config('advertising.fatigue_limit', 100)),
              'windowStart' => $windowStart->toIso8601String(),
              'windowEnd' => $windowEnd->toIso8601String(),
          ];
"""
          if old not in content:
              raise SystemExit('Frequency fallback block not found')
          service.write_text(content.replace(old, new, 1))

          test = Path('tests/Feature/Modules/Advertising/AdvertisingMatchingTest.php')
          content = test.read_text()
          old = """        $match = $service->evaluate($user, $campaign);
          $replayed = $service->evaluate($user, $campaign);
"""
          new = """        $match = $service->evaluate($user, $campaign);
          $this->travel(2)->seconds();
          $replayed = $service->evaluate($user, $campaign);
"""
          if old not in content:
              raise SystemExit('Replay block not found')
          content = content.replace(old, new, 1)

          marker = """    /** @return array{0:Campaign,1:AdvertisingSegment} */
    private function approvedOrangeCampaign(): array
"""
          fatigue = """    public function test_fatigue_threshold_withholds_matching_without_consuming_quota(): void
    {
        $user = $this->readyGoldUser();
        [$campaign] = $this->approvedOrangeCampaign();
        AdvertisingFrequencyCounter::query()->create([
            'account_id' => $user->id,
            'campaign_id' => $campaign->id,
            'window_start' => now()->subHour(),
            'window_end' => now()->addHours(23),
            'impressions' => 1,
            'fatigue_score' => 100,
            'version' => 1,
        ]);

        $match = app(CampaignEligibilityService::class)->evaluate($user, $campaign);

        expect($match->decision)->toBe('withheld')
            ->and($match->exclusion_codes)->toContain('fatigue_safety_hold')
            ->and($match->frequency_state['impressions'])->toBe(1);
    }

"""
          if marker not in content:
              raise SystemExit('Test insertion marker not found')
          test.write_text(content.replace(marker, fatigue + marker, 1))
          PY

      - name: Format exact PHP changes
        run: >-
          vendor/bin/pint
          app/Modules/Advertising/Application/Services/CampaignEligibilityService.php
          tests/Feature/Modules/Advertising/AdvertisingMatchingTest.php

      - name: Commit robustness changes only
        working-directory: .
        run: |
          git config user.name "wasplex-ci"
          git config user.email "actions@users.noreply.github.com"
          git add apps/platform/app/Modules/Advertising/Application/Services/CampaignEligibilityService.php
          git add apps/platform/tests/Feature/Modules/Advertising/AdvertisingMatchingTest.php
          if git diff --cached --quiet; then
            echo "No robustness changes required."
            exit 0
          fi
          git commit -m "test(advertising): harden idempotence and fatigue matching"
          git push origin HEAD:codex/p008-smart-profile-matching
