name: p009c-harden

on:
  push:
    branches:
      - agent/p009c-user-feed-player

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout P009-C branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/p009c-user-feed-player

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json

      - name: Apply final hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one match in {path}, found {text.count(old)}')
              file.write_text(text.replace(old, new, 1))

          Path('apps/platform/app/Modules/Distribution/Application/Services/FeedInteractionService.php').write_text(r'''<?php

          namespace App\Modules\Distribution\Application\Services;

          use App\Modules\Distribution\Domain\Enums\AdvertisingDeliveryStatus;
          use App\Modules\Distribution\Domain\Exceptions\DistributionException;
          use App\Modules\Distribution\Infrastructure\Models\AdvertisingDelivery;
          use App\Modules\Identity\Infrastructure\Models\Account;
          use Illuminate\Support\Facades\DB;
          use Illuminate\Support\Str;

          final readonly class FeedInteractionService
          {
              private const ALLOWED_REASONS = [
                  'skipped',
                  'not_relevant',
                  'technical_issue',
              ];

              public function __construct(
                  private AdvertisingDeliveryOutbox $outbox,
              ) {}

              public function dismiss(
                  Account $account,
                  AdvertisingDelivery $delivery,
                  string $idempotencyKey,
                  string $reason,
              ): AdvertisingDelivery {
                  if (! in_array($reason, self::ALLOWED_REASONS, true)) {
                      throw new DistributionException('Le motif de masquage publicitaire est invalide.');
                  }

                  return DB::transaction(function () use ($account, $delivery, $idempotencyKey, $reason): AdvertisingDelivery {
                      $locked = AdvertisingDelivery::query()->whereKey($delivery->id)->lockForUpdate()->firstOrFail();

                      if ($locked->account_id !== $account->id) {
                          throw new DistributionException('Cette livraison ne correspond pas au compte authentifié.');
                      }

                      if ($locked->status !== AdvertisingDeliveryStatus::Delivered) {
                          throw new DistributionException('Seule une publicité déjà livrée peut être masquée.');
                      }

                      $eventKey = 'feed-item-dismissed:'.$locked->id;
                      $inserted = DB::table('advertising_delivery_events')->insertOrIgnore([
                          'id' => (string) Str::ulid(),
                          'advertising_delivery_id' => $locked->id,
                          'event_type' => 'FeedItemDismissed',
                          'idempotency_key' => $eventKey,
                          'occurred_at' => now(),
                          'metadata' => json_encode([
                              'reason' => $reason,
                              'request_idempotency_hash' => hash('sha256', $idempotencyKey),
                              'quota_restored' => false,
                              'financial_operation_created' => false,
                              'wallet_operation_created' => false,
                          ], JSON_THROW_ON_ERROR),
                          'created_at' => now(),
                      ]);

                      if ($inserted === 1) {
                          $this->outbox->record(
                              'advertising_delivery',
                              $locked->id,
                              'FEED_ITEM_DISMISSED',
                              $eventKey,
                              [
                                  'delivery_id' => $locked->id,
                                  'feed_session_id' => $locked->feed_session_id,
                                  'campaign_id' => $locked->campaign_id,
                                  'reason' => $reason,
                                  'quota_restored' => false,
                                  'financial_operation_created' => false,
                                  'wallet_operation_created' => false,
                              ],
                          );

                          DB::afterCommit(static fn () => event('distribution.feed-item-dismissed', [$locked->id]));
                      }

                      return $locked->refresh();
                  }, 5);
              }
          }
          '''.replace('\n          ', '\n').lstrip())

          replace_once(
              'apps/platform/app/Modules/Distribution/Application/Services/AdvertisingDeliveryService.php',
              """        $remaining = $counter === null
                      ? 0
                      : max(0, (int) $counter->quota_limit - (int) $counter->consumed);

                  return [
          """,
              """        $remaining = $counter === null
                      ? 0
                      : max(0, (int) $counter->quota_limit - (int) $counter->consumed);
                  $campaign = Campaign::query()->with('brand')->find($delivery->campaign_id);
                  $version = CampaignVersion::query()->find($delivery->campaign_version_id);
                  $brandName = $campaign instanceof Campaign ? $campaign->brand->name : null;

                  return [
          """,
          )
          replace_once(
              'apps/platform/app/Modules/Distribution/Application/Services/AdvertisingDeliveryService.php',
              """            'creative_id' => $delivery->creative_asset_id,
                      'creative_type' => $delivery->creative_type,
          """,
              """            'creative_id' => $delivery->creative_asset_id,
                      'campaign_name' => $campaign?->name,
                      'brand_name' => $brandName,
                      'headline' => $version?->headline,
                      'body' => $version?->body,
                      'cta_label' => $version?->call_to_action,
                      'creative_type' => $delivery->creative_type,
          """,
          )

          replace_once(
              'apps/platform/tests/Feature/Modules/Distribution/AdvertisingDeliveryTest.php',
              """use App\\Modules\\Distribution\\Application\\Services\\AdvertisingDeliveryService;
          """,
              """use App\\Modules\\Distribution\\Application\\Services\\AdvertisingDeliveryService;
          use App\\Modules\\Distribution\\Application\\Services\\FeedInteractionService;
          """,
          )
          replace_once(
              'apps/platform/tests/Feature/Modules/Distribution/AdvertisingDeliveryTest.php',
              """    public function test_released_prepared_delivery_consumes_zero_quota_and_zero_frequency(): void
          """,
              """    public function test_dismiss_is_idempotent_without_restoring_quota_or_creating_value(): void
              {
                  [$user] = $this->readyDelivery();
                  $deliveries = app(AdvertisingDeliveryService::class);
                  $interactions = app(FeedInteractionService::class);
                  $session = $deliveries->startSession($user, 'feed-session-p009c-dismiss');
                  $prepared = $deliveries->reserveNext($user, $session, 'delivery-p009c-dismiss');
                  $delivered = $deliveries->deliver($user, $prepared, 'confirm-p009c-dismiss');
                  $ledgerBefore = LedgerTransaction::query()->count();
                  $walletOperationsBefore = WalletOperation::query()->count();
                  $attemptsBefore = ValueAttempt::query()->count();

                  $dismissed = $interactions->dismiss(
                      $user,
                      $delivered,
                      'dismiss-p009c-first',
                      'not_relevant',
                  );
                  $replayed = $interactions->dismiss(
                      $user,
                      $delivered,
                      'dismiss-p009c-replay',
                      'not_relevant',
                  );

                  self::assertSame($dismissed->id, $replayed->id);
                  self::assertSame(AdvertisingDeliveryStatus::Delivered, $replayed->status);
                  self::assertSame(
                      1,
                      DB::table('advertising_delivery_events')
                          ->where('advertising_delivery_id', $delivered->id)
                          ->where('event_type', 'FeedItemDismissed')
                          ->count(),
                  );
                  self::assertSame(
                      1,
                      DB::table('advertising_delivery_outbox_events')
                          ->where('aggregate_id', $delivered->id)
                          ->where('event_code', 'FEED_ITEM_DISMISSED')
                          ->count(),
                  );
                  self::assertSame(
                      1,
                      (int) DB::table('subscription_quota_counters')
                          ->where('id', $delivered->subscription_quota_counter_id)
                          ->value('consumed'),
                  );
                  self::assertSame(
                      1,
                      DB::table('advertising_quota_consumptions')
                          ->where('advertising_delivery_id', $delivered->id)
                          ->count(),
                  );
                  self::assertSame($ledgerBefore, LedgerTransaction::query()->count());
                  self::assertSame($walletOperationsBefore, WalletOperation::query()->count());
                  self::assertSame($attemptsBefore, ValueAttempt::query()->count());
              }

              public function test_released_prepared_delivery_consumes_zero_quota_and_zero_frequency(): void
          """,
          )

          replace_once(
              'apps/platform/tests/Feature/Modules/Distribution/UserFeedPageTest.php',
              """it('renders the P009-C feed with server-owned wallet and endpoint contracts', function (): void {
          """,
              """it('refuses the user feed while an advertiser space is active', function (): void {
              registerAccount($this, 'feed-advertiser-context@example.com');
              $spaceId = $this->postJson('/api/me/spaces/advertiser', [
                  'organization_name' => 'Studio Feed Isolation',
              ])->assertCreated()->json('data.space_id');

              $this->postJson(\"/api/me/spaces/{$spaceId}/switch\")->assertOk();
              $this->get('/mon-espace/pour-toi')->assertForbidden();
          });

          it('renders the P009-C feed with server-owned wallet and endpoint contracts', function (): void {
          """,
          )

          feed = Path('apps/platform/resources/js/pages/User/Feed.vue')
          text = feed.read_text()
          text = text.replace(
              """    creative_id: string;
              creative_type: 'image' | 'video';
          """,
              """    creative_id: string;
              campaign_name: string | null;
              brand_name: string | null;
              headline: string | null;
              body: string | null;
              cta_label: string | null;
              creative_type: 'image' | 'video';
          """,
              1,
          )
          text = text.replace(
              """const dataSaver = ref(false);
          const video = ref<HTMLVideoElement | null>(null);
          """,
              """const dataSaver = ref(false);
          const advancingDelivery = ref(false);
          const video = ref<HTMLVideoElement | null>(null);
          """,
              1,
          )
          text = text.replace(
              """const mediaFailure = async (message: string) => {
              clearMediaTimer();
              errorMessage.value = message;
              await releasePrepared();
              delivery.value = null;
              state.value = online.value ? 'failed' : 'offline';
          };
          """,
              """const mediaFailure = async (message: string) => {
              clearMediaTimer();
              const current = delivery.value;

              if (current?.status === 'prepared') {
                  await releasePrepared();
                  errorMessage.value = `${message} Aucun quota n’a été consommé.`;
              } else if (current?.status === 'delivered') {
                  errorMessage.value = `${message} La livraison était déjà confirmée ; aucun second quota ne sera consommé.`;
              } else {
                  errorMessage.value = message;
              }

              delivery.value = null;
              state.value = online.value ? 'failed' : 'offline';
          };
          """,
              1,
          )
          text = text.replace(
              """                'Le média met trop de temps à répondre. Aucun quota n’a été consommé.',
          """,
              """                'Le média met trop de temps à répondre.',
          """,
              1,
          )
          text = text.replace(
              """const dismissCurrent = async (reason: 'skipped' | 'not_relevant' | 'technical_issue') => {
              const current = delivery.value;

              if (!current) {
                  await prepareNext();
                  return;
              }

              clearMediaTimer();
              video.value?.pause();

              try {
                  if (current.status === 'prepared') {
                      await releasePrepared();
                  } else if (current.status === 'delivered') {
                      await api<Delivery>(
                          endpoint(props.endpoints.dismiss, '__DELIVERY__', current.delivery_id),
                          'POST',
                          `dismiss-${current.delivery_id}`.slice(0, 64),
                          { reason },
                      );
                  }
              } finally {
                  delivery.value = null;
                  await prepareNext();
              }
          };
          """,
              """const dismissCurrent = async (reason: 'skipped' | 'not_relevant' | 'technical_issue') => {
              if (advancingDelivery.value) {
                  return;
              }

              advancingDelivery.value = true;
              const current = delivery.value;

              try {
                  if (!current) {
                      await prepareNext();
                      return;
                  }

                  clearMediaTimer();
                  video.value?.pause();

                  if (current.status === 'prepared') {
                      await releasePrepared();
                  } else if (current.status === 'delivered') {
                      await api<Delivery>(
                          endpoint(props.endpoints.dismiss, '__DELIVERY__', current.delivery_id),
                          'POST',
                          `dismiss-${current.delivery_id}`.slice(0, 64),
                          { reason },
                      );
                  }

                  delivery.value = null;
                  await prepareNext();
              } finally {
                  advancingDelivery.value = false;
              }
          };
          """,
              1,
          )
          text = text.replace(
              """                                    'Cette image ne peut pas être affichée. Aucun quota n’a été consommé.',
          """,
              """                                    'Cette image ne peut pas être affichée.',
          """,
              1,
          )
          text = text.replace(
              """                                    'Cette vidéo ne peut pas être lue. Aucun quota n’a été consommé.',
          """,
              """                                    'Cette vidéo ne peut pas être lue.',
          """,
              1,
          )
          text = text.replace(
              """                            <p class=\"mt-3 text-sm font-black\">
                              Quota restant : {{ delivery.quota_remaining }}
                          </p>
                          <p class=\"mt-1 text-xs text-white/48\">
                              La preuve d’attention sera traitée dans la phase suivante.
                          </p>
          """,
              """                            <p class=\"mt-3 text-xs font-black tracking-[0.16em] text-wasplex-cyan uppercase\">
                              {{ delivery.brand_name || delivery.campaign_name || 'Annonceur Wasplex' }}
                          </p>
                          <h2 v-if=\"delivery.headline\" class=\"mt-2 text-lg font-black leading-tight\">
                              {{ delivery.headline }}
                          </h2>
                          <p v-if=\"delivery.body\" class=\"mt-1 line-clamp-3 text-xs leading-5 text-white/60\">
                              {{ delivery.body }}
                          </p>
                          <p class=\"mt-3 text-sm font-black\">
                              Quota restant : {{ delivery.quota_remaining }}
                          </p>
                          <p class=\"mt-1 text-xs text-white/48\">
                              La preuve d’attention sera traitée dans la phase suivante.
                          </p>
          """,
              1,
          )
          text = text.replace(
              """                                    Découvrir
          """,
              """                                    {{ delivery.cta_label || 'Découvrir' }}
          """,
              1,
          )
          text = text.replace(
              """                                aria-label=\"Passer cette publicité\"
                              @click=\"dismissCurrent('skipped')\"
          """,
              """                                aria-label=\"Passer cette publicité\"
                              :disabled=\"advancingDelivery\"
                              class=\"grid size-11 place-items-center rounded-full border border-white/15 bg-black/45 text-xs font-black backdrop-blur-lg disabled:cursor-wait disabled:opacity-40\"
                              @click=\"dismissCurrent('skipped')\"
          """,
              1,
          )
          text = text.replace(
              """                                class=\"grid size-11 place-items-center rounded-full border border-white/15 bg-black/45 text-xs font-black backdrop-blur-lg\"
                              aria-label=\"Passer cette publicité\"
                              :disabled=\"advancingDelivery\"
          """,
              """                                aria-label=\"Passer cette publicité\"
                              :disabled=\"advancingDelivery\"
          """,
              1,
          )
          text = text.replace(
              """                                aria-label=\"Voir moins de contenus similaires\"
                              @click=\"dismissCurrent('not_relevant')\"
          """,
              """                                aria-label=\"Voir moins de contenus similaires\"
                              :disabled=\"advancingDelivery\"
                              class=\"grid size-11 place-items-center rounded-full border border-white/15 bg-black/45 text-[0.6rem] font-black backdrop-blur-lg disabled:cursor-wait disabled:opacity-40\"
                              @click=\"dismissCurrent('not_relevant')\"
          """,
              1,
          )
          text = text.replace(
              """                                class=\"grid size-11 place-items-center rounded-full border border-white/15 bg-black/45 text-[0.6rem] font-black backdrop-blur-lg\"
                              aria-label=\"Voir moins de contenus similaires\"
                              :disabled=\"advancingDelivery\"
          """,
              """                                aria-label=\"Voir moins de contenus similaires\"
                              :disabled=\"advancingDelivery\"
          """,
              1,
          )
          required = [
              'campaign_name: string | null;',
              'const advancingDelivery = ref(false);',
              'aucun second quota ne sera consommé.',
              "delivery.brand_name || delivery.campaign_name",
              "delivery.cta_label || 'Découvrir'",
              ':disabled="advancingDelivery"',
          ]
          for token in required:
              if token not in text:
                  raise SystemExit(f'Missing expected Feed hardening token: {token}')
          feed.write_text(text)
          PY

      - name: Install PHP dependencies
        working-directory: apps/platform
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install frontend dependencies
        working-directory: apps/platform
        run: npm ci

      - name: Format PHP
        working-directory: apps/platform
        run: composer lint

      - name: Format frontend
        working-directory: apps/platform
        run: npm run format

      - name: Commit final hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/platform
          git commit -m "fix(feed): harden P009-C delivery interactions"
          git push origin HEAD:agent/p009c-user-feed-player
