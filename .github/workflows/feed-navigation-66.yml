name: feed-navigation-66

on:
  push:
    branches:
      - feat/feed-navigation-interactions

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json
      - name: Apply feed navigation refactor
        run: |
          python3 .github/scripts/feed_navigation_66.py
          python3 .github/scripts/feed_navigation_66_fix.py
      - name: Validate frontend
        working-directory: apps/platform
        run: |
          npm ci
          npx prettier --write resources/js/Components/FeedPanel.vue resources/js/Pages/Identity/UserShell.vue
          npm run lint:check
          npm run types:check
          npm run build
      - name: Commit product files only
        run: |
          if git diff --quiet -- apps/platform/resources/js/Components/FeedPanel.vue apps/platform/resources/js/Pages/Identity/UserShell.vue; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- apps/platform/resources/js/Components/FeedPanel.vue apps/platform/resources/js/Pages/Identity/UserShell.vue
          git commit -m "feat(feed): refine navigation and interactions"
          git push origin HEAD:feat/feed-navigation-interactions
