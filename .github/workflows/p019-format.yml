name: p019-format

on:
  push:
    branches:
      - feat/p019-professional-institutional-spaces
    paths:
      - .github/workflows/p019-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p019-professional-institutional-spaces
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json
      - name: Install dependencies
        working-directory: apps/platform
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
      - name: Format P019
        working-directory: apps/platform
        run: |
          npx prettier --write \
            resources/js/Components/AdminProfessionalSpacesPanel.vue \
            resources/js/Components/ProfessionalSpaceEntryPanel.vue \
            resources/js/Pages/Identity/ProfessionalShell.vue \
            resources/js/Pages/Identity/UserShell.vue \
            resources/js/Pages/Identity/AdminShell.vue
          vendor/bin/pint \
            app/Modules/Identity/Database/Migrations/2026_08_12_140000_create_professional_space_foundation.php \
            app/Modules/Identity/Infrastructure/Models/ProfessionalSpace.php \
            app/Modules/Identity/Infrastructure/Models/ProfessionalRoleAssignment.php \
            app/Modules/Identity/Infrastructure/Models/ProfessionalServicePoint.php \
            app/Modules/Identity/Infrastructure/Models/UserSpace.php \
            app/Modules/Identity/Application/Services/ProfessionalSpaceRegistrationService.php \
            app/Modules/Identity/Http/Controllers/Api/ProfessionalSpacesController.php \
            app/Modules/Identity/Http/Controllers/Admin/ProfessionalSpacesController.php \
            app/Modules/Identity/Http/Middleware/EnsureActiveProfessionalOrganization.php \
            app/Modules/Identity/Http/Controllers/Api/ProfessionalWorkspaceController.php \
            app/Modules/Identity/Http/Controllers/ProfessionalShellController.php \
            app/Modules/Identity/Http/routes/api.php \
            app/Modules/Identity/Http/routes/web.php \
            app/Modules/Identity/Console/SeedFounderCommand.php \
            tests/Feature/Identity/ProfessionalSpacesTest.php
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/platform
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(p019): appliquer le formatage"
          git push origin HEAD:feat/p019-professional-institutional-spaces
