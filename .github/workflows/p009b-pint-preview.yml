name: p009b-pint-preview

on:
  pull_request:
    paths:
      - "apps/platform/app/Modules/Distribution/**"
      - "apps/platform/tests/Feature/Modules/Distribution/**"
      - "apps/platform/config/distribution.php"
      - "apps/platform/bootstrap/providers.php"
      - ".github/workflows/p009b-pint-preview.yml"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Apply Pint in preview workspace
        run: >-
          vendor/bin/pint
          app/Modules/Distribution
          tests/Feature/Modules/Distribution
          config/distribution.php
          bootstrap/providers.php

      - name: Print formatted patch
        working-directory: .
        run: |
          git diff -- apps/platform/app/Modules/Distribution apps/platform/tests/Feature/Modules/Distribution apps/platform/config/distribution.php apps/platform/bootstrap/providers.php
          test -z "$(git diff --name-only -- apps/platform/app/Modules/Distribution apps/platform/tests/Feature/Modules/Distribution apps/platform/config/distribution.php apps/platform/bootstrap/providers.php)"
