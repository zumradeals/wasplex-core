name: p016-format

on:
  push:
    branches:
      - feat/p016-a-sante-citoyen-capsule
    paths:
      - .github/workflows/p016-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p016-a-sante-citoyen-capsule
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json
      - name: Install dependencies
        working-directory: apps/platform
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
      - name: Format P016-A
        working-directory: apps/platform
        run: |
          npx prettier --write resources/js/Components/HealthPanel.vue resources/js/Components/AlertsPanel.vue
          vendor/bin/pint \
            app/Modules/Health \
            tests/Feature/Health/HealthCitizenTest.php \
            bootstrap/providers.php
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/platform/app/Modules/Health apps/platform/tests/Feature/Health/HealthCitizenTest.php apps/platform/bootstrap/providers.php apps/platform/resources/js/Components/HealthPanel.vue apps/platform/resources/js/Components/AlertsPanel.vue
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(health): appliquer le formatage P016-A"
          git push origin HEAD:feat/p016-a-sante-citoyen-capsule
