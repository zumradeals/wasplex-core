name: prettier-geniuspay-preview

on:
  pull_request:

permissions:
  contents: read

jobs:
  preview:
    if: github.head_ref == 'codex/admin-geniuspay-configuration'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Format and encode page
        run: |
          npx prettier --write resources/js/pages/Admin/GeniusPayConfiguration.vue
          echo 'FORMATTED_FILE_BASE64_BEGIN'
          base64 -w 0 resources/js/pages/Admin/GeniusPayConfiguration.vue
          echo
          echo 'FORMATTED_FILE_BASE64_END'
