name: p019-format-temp

on:
  push:
    branches:
      - feat/p019-public-feed-onboarding

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Format P019 files
        run: npx prettier --write resources/js/Components/PhoneQuickConnect.vue resources/js/Pages/Identity/GuestFeed.vue

      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/Components/PhoneQuickConnect.vue resources/js/Pages/Identity/GuestFeed.vue

          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
            exit 0
          fi

          git commit -m "P019 — formatter le Feed invité et l’onboarding"
          git push origin HEAD:feat/p019-public-feed-onboarding
