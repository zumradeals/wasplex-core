name: P014-G Stabilisation

on:
  push:
    branches:
      - feat/p014-g-stabilisation-fonds

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wasplex_test
          POSTGRES_USER: wasplex
          POSTGRES_PASSWORD: wasplex_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wasplex -d wasplex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_pgsql, redis
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json

      - name: Apply P014-G stabilization
        run: python3 .github/scripts/p014-g-stabilize.py

      - name: Fix P014-G integrity probe
        run: |
          python3 - <<'PY'
          from pathlib import Path

          command = Path('apps/platform/app/Modules/Funds/Console/FundIntegrityCheckCommand.php')
          text = command.read_text()
          old = """            'overcollected_snapshots' => (int) DB::table('fund_collection_snapshots as snapshots')
                          ->leftJoin('fund_collection_debits as debits', 'debits.snapshot_id', '=', 'snapshots.id')
                          ->groupBy('snapshots.id', 'snapshots.collective_amount_minor')
                          ->havingRaw('COALESCE(SUM(debits.debited_solidarity_minor), 0) > snapshots.collective_amount_minor')
                          ->get()
                          ->count(),
          """
          new = """            'overcollected_snapshots' => (int) DB::query()
                          ->fromSub(
                              DB::table('fund_collection_snapshots as snapshots')
                                  ->leftJoin('fund_collection_debits as debits', 'debits.snapshot_id', '=', 'snapshots.id')
                                  ->selectRaw('snapshots.id')
                                  ->groupBy('snapshots.id', 'snapshots.collective_amount_minor')
                                  ->havingRaw('COALESCE(SUM(debits.debited_solidarity_minor), 0) > snapshots.collective_amount_minor'),
                              'overcollected',
                          )
                          ->count(),
          """
          if old not in text:
              raise SystemExit('P014-G integrity query pattern missing')
          command.write_text(text.replace(old, new, 1))

          test = Path('apps/platform/tests/Feature/Funds/FundsRealizationTest.php')
          text = test.read_text().replace('use RuntimeException;\n', '', 1)
          text = text.replace(
              "->toThrow(RuntimeException::class, 'avant le snapshot');",
              "->toThrow(\\RuntimeException::class, 'avant le snapshot');",
              1,
          )
          test.write_text(text)
          PY

      - name: Install dependencies
        working-directory: apps/platform
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Normalize source
        working-directory: apps/platform
        run: |
          composer lint
          npm run format

      - name: Validate frontend
        working-directory: apps/platform
        run: |
          npm run format:check
          npm run lint:check
          npm run types:check
          npm run build

      - name: Validate PHP and Funds suite
        working-directory: apps/platform
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: wasplex_test
          DB_USERNAME: wasplex
          DB_PASSWORD: wasplex_ci_only
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: |
          composer lint:check
          php artisan test tests/Feature/Funds
          composer test
          php artisan migrate:fresh --force
          php artisan funds:integrity-check

      - name: Commit stabilized P014-G
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            apps/platform/app/Modules/Funds/Application/Services/FundPilotageService.php \
            apps/platform/app/Modules/Funds/Application/Services/FundCollectionWaveService.php \
            apps/platform/app/Modules/Funds/Application/Services/FundCollectionService.php \
            apps/platform/app/Modules/Funds/Application/Services/FundRealizationService.php \
            apps/platform/app/Modules/Funds/Http/Controllers/Admin/AdminFundPilotageController.php \
            apps/platform/app/Modules/Funds/Infrastructure/Providers/FundsServiceProvider.php \
            apps/platform/app/Modules/Funds/Console/FundIntegrityCheckCommand.php \
            apps/platform/app/Modules/Funds/Database/Migrations/2026_08_13_030000_stabilize_fund_invariants.php \
            apps/platform/tests/Feature/Funds/FundsCollectionWaveTest.php \
            apps/platform/tests/Feature/Funds/FundsRealizationTest.php \
            docs/chantiers/P014-G-FONDS-STABILISATION-FINALE.md
          git add -u -- .github/scripts/p014-g-stabilize.py .github/workflows/p014-g-stabilization.yml
          git diff --cached --check
          git commit -m "fix(funds): stabiliser P014-G"
          git push origin HEAD:feat/p014-g-stabilisation-fonds
