name: p014-e-finalize

on:
  push:
    branches:
      - feat/p014-e-fonds-realisation

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, 'finaliser P014-E réalisation') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wasplex_test
          POSTGRES_USER: wasplex
          POSTGRES_PASSWORD: wasplex_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wasplex -d wasplex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/p014-e-fonds-realisation
          persist-credentials: true

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_pgsql, redis
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json

      - name: Install dependencies
        working-directory: apps/platform
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Wire P014-E surfaces and capabilities
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old in text:
                  p.write_text(text.replace(old, new, 1))
                  return
              if new in text:
                  return
              raise SystemExit(f"Pattern not found in {path}: {old[:80]!r}")

          funds = 'apps/platform/resources/js/Components/FundsPanel.vue'
          replace_once(funds,
              "import FundWishContribution from '@/Components/FundWishContribution.vue';",
              "import FundWishContribution from '@/Components/FundWishContribution.vue';\nimport FundRealizationStatusCard from '@/Components/FundRealizationStatusCard.vue';")
          replace_once(funds,
              '<FundBalanceCard v-if="activeMembership" :balances="data.balances" @refresh="load" />',
              '<FundBalanceCard v-if="activeMembership" :balances="data.balances" @refresh="load" />\n\n            <FundRealizationStatusCard v-if="activeMembership" />')

          admin = 'apps/platform/resources/js/Components/AdminFundsPanel.vue'
          replace_once(admin,
              "import AdminFundCollections from '@/Components/AdminFundCollections.vue';",
              "import AdminFundCollections from '@/Components/AdminFundCollections.vue';\nimport AdminFundRealizations from '@/Components/AdminFundRealizations.vue';")
          replace_once(admin,
              '            <AdminFundCollections />',
              '            <AdminFundCollections />\n\n            <AdminFundRealizations />')

          pro = Path('apps/platform/resources/js/Pages/Identity/ProfessionalShell.vue')
          text = pro.read_text()
          if "import ProfessionalFundOrdersPanel" not in text:
              text = text.replace(
                  "import ProfessionalFundQuotesPanel from '@/Components/ProfessionalFundQuotesPanel.vue';",
                  "import ProfessionalFundQuotesPanel from '@/Components/ProfessionalFundQuotesPanel.vue';\nimport ProfessionalFundOrdersPanel from '@/Components/ProfessionalFundOrdersPanel.vue';",
                  1,
              )
          if '<ProfessionalFundOrdersPanel' not in text:
              pattern = re.compile(
                  r'<ProfessionalFundQuotesPanel\s+v-else-if="activeTab === \'funds\'"\s+:can-respond="canRespondToFundQuotes"\s+class="mt-4"\s*/>',
                  re.MULTILINE,
              )
              replacement = '''<div v-else-if="activeTab === 'funds'">
                        <ProfessionalFundQuotesPanel :can-respond="canRespondToFundQuotes" class="mt-4" />
                        <ProfessionalFundOrdersPanel :can-act="canRespondToFundQuotes" />
                    </div>'''
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit('Professional Funds panel block not found')
          pro.write_text(text)

          workspace = 'apps/platform/app/Modules/Identity/Http/Controllers/Api/ProfessionalWorkspaceController.php'
          replace_once(workspace,
              "$fundsView = $this->supportsFundsPartner($space) ? ['professional.funds.quote.view'] : [];",
              "$fundsView = $this->supportsFundsPartner($space)\n            ? ['professional.funds.quote.view', 'professional.funds.order.view']\n            : [];")
          replace_once(workspace,
              "? ['professional.funds.quote.view', 'professional.funds.quote.respond']",
              "? [\n                'professional.funds.quote.view',\n                'professional.funds.quote.respond',\n                'professional.funds.order.view',\n                'professional.funds.milestone.submit',\n                'professional.funds.delivery.confirm',\n            ]")

          service = 'apps/platform/app/Modules/Funds/Application/Services/FundRealizationService.php'
          replace_once(service,
              "            if ($milestone === null || $milestone->status !== 'approved') throw new RuntimeException('Le jalon doit être validé avant allocation.');\n            if ($milestone->ledger_transaction_id !== null) return (array) $milestone;",
              "            if ($milestone === null) throw new RuntimeException('Jalon introuvable.');\n            if ($milestone->ledger_transaction_id !== null) return (array) $milestone;\n            if ($milestone->status !== 'approved') throw new RuntimeException('Le jalon doit être validé avant allocation.');")
          replace_once(service,
              "    public function confirmExternalSettlement(FundOrder $order, string $milestoneId, string $reference): array\n    {\n        return DB::transaction",
              "    public function confirmExternalSettlement(FundOrder $order, string $milestoneId, string $reference): array\n    {\n        if (trim($reference) === '') throw new RuntimeException('Une référence de règlement externe est obligatoire.');\n\n        return DB::transaction")

          test = 'apps/platform/tests/Feature/Funds/FundsRealizationTest.php'
          replace_once(test,
              "    expect(fn () => $service->postMilestoneToLedger($order->refresh(), $milestone['id'], $fixture['beneficiary']->id))\n        ->toThrow(RuntimeException::class, 'validé');",
              "    $replayed = $service->postMilestoneToLedger($order->refresh(), $milestone['id'], $fixture['beneficiary']->id);\n    expect($replayed['ledger_transaction_id'])->toBe($posted['ledger_transaction_id'])\n        ->and(LedgerTransaction::query()->where('type', 'FUND_PROVIDER_MILESTONE_ALLOCATION')->count())->toBe(1);")
          PY

      - name: Normalize source
        working-directory: apps/platform
        run: |
          npx prettier --write \
            resources/js/Components/FundRealizationStatusCard.vue \
            resources/js/Components/ProfessionalFundOrdersPanel.vue \
            resources/js/Components/AdminFundRealizations.vue \
            resources/js/Components/FundsPanel.vue \
            resources/js/Components/AdminFundsPanel.vue \
            resources/js/Pages/Identity/ProfessionalShell.vue
          ./vendor/bin/pint app/Modules/Funds app/Modules/Identity/Http/Controllers/Api/ProfessionalWorkspaceController.php tests/Feature/Funds/FundsRealizationTest.php

      - name: Validate frontend
        working-directory: apps/platform
        run: |
          npm run format:check
          npm run lint:check
          npm run types:check
          npm run build

      - name: Validate PHP and P014-E
        working-directory: apps/platform
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: wasplex_test
          DB_USERNAME: wasplex
          DB_PASSWORD: wasplex_ci_only
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: |
          composer lint:check
          php artisan test tests/Feature/Funds/FundsRealizationTest.php
          composer test

      - name: Commit finalized P014-E
        run: |
          rm .github/workflows/p014-e-finalize.yml
          git config user.name "zumradeals"
          git config user.email "zumradeals@gmail.com"
          git add -A
          git commit -m "feat(funds): finaliser P014-E réalisation"
          git push origin HEAD:feat/p014-e-fonds-realisation
