name: Wallet History + Funds Seed

on:
  push:
    branches:
      - feat/wallet-history-funds-seed

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wasplex_test
          POSTGRES_USER: wasplex
          POSTGRES_PASSWORD: wasplex_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wasplex -d wasplex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/wallet-history-funds-seed
          fetch-depth: 0

      - name: Apply Wallet/Funds patch
        run: |
          python3 scripts/apply_wallet_history_funds_seed.py
          python3 scripts/fix_wallet_history_funds_test_fixtures.py

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_pgsql, redis
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json

      - name: Install PHP dependencies
        working-directory: apps/platform
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test environment
        working-directory: apps/platform
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Install frontend dependencies
        working-directory: apps/platform
        run: npm ci

      - name: Format generated sources
        working-directory: apps/platform
        run: |
          composer lint
          npm run format
          npm run lint

      - name: Check frontend
        working-directory: apps/platform
        run: |
          npm run format:check
          npm run lint:check
          npm run types:check
          npm run build

      - name: Check PHP formatting
        working-directory: apps/platform
        run: composer lint:check

      - name: Run focused Wallet/Funds tests
        working-directory: apps/platform
        run: php artisan test tests/Feature/Wallet/WalletHistoryAndFundsSeedTest.php tests/Feature/Wallet/WalletV2Test.php tests/Feature/Funds
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: wasplex_test
          DB_USERNAME: wasplex
          DB_PASSWORD: wasplex_ci_only
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379

      - name: Run full Laravel suite
        working-directory: apps/platform
        run: composer test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: wasplex_test
          DB_USERNAME: wasplex
          DB_PASSWORD: wasplex_ci_only
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379

      - name: Fresh migration and seed smoke test
        working-directory: apps/platform
        run: |
          php artisan migrate:fresh --force
          php artisan ledger:seed-catalog
          php artisan subscriptions:seed-catalog
          php artisan funds:seed-programs
          php artisan funds:seed-programs
          php artisan funds:integrity-check
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: wasplex_test
          DB_USERNAME: wasplex
          DB_PASSWORD: wasplex_ci_only
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379

      - name: Remove temporary CI helpers
        run: |
          rm -f scripts/apply_wallet_history_funds_seed.py
          rm -f scripts/fix_wallet_history_funds_test_fixtures.py
          rm -f .github/workflows/wallet-history-funds-seed.yml

      - name: Commit validated implementation
        run: |
          git config user.name "zumradeals"
          git config user.email "zumradeals@gmail.com"
          git add -- \
            apps/platform/app/Modules/Wallet/Application/Services/UserWalletQueryService.php \
            apps/platform/app/Modules/Wallet/Http/Controllers/User/WalletController.php \
            apps/platform/resources/js/Components/WalletHistoryAccordions.vue \
            apps/platform/resources/js/Components/WalletPanel.vue \
            apps/platform/app/Modules/Funds/Application/Services/FundContributionService.php \
            apps/platform/app/Modules/Funds/Http/Controllers/User/FundsController.php \
            apps/platform/resources/js/Components/FundsPanel.vue \
            apps/platform/app/Modules/Funds/Console/SeedFundProgramsCommand.php \
            apps/platform/app/Modules/Funds/Infrastructure/Providers/FundsServiceProvider.php \
            apps/platform/tests/Feature/Wallet/WalletHistoryAndFundsSeedTest.php \
            apps/platform/tests/Feature/Funds/FundsFoundationTest.php \
            apps/platform/tests/Feature/Funds/FundsPersonalContributionTest.php \
            scripts/apply_wallet_history_funds_seed.py \
            scripts/fix_wallet_history_funds_test_fixtures.py \
            .github/workflows/wallet-history-funds-seed.yml
          git commit -m "feat(wallet): categoriser historique et initialiser programmes Fonds"
          test -z "$(git status --porcelain)"
          git push origin HEAD:feat/wallet-history-funds-seed
