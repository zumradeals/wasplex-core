name: p014-e-warranty-finalize

on:
  push:
    branches:
      - feat/p014-e-fonds-realisation

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, 'finaliser garantie P014-E de bout en bout') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: wasplex_test
          POSTGRES_USER: wasplex
          POSTGRES_PASSWORD: wasplex_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wasplex -d wasplex_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/p014-e-fonds-realisation
          persist-credentials: true

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.4"
          extensions: mbstring, pdo_pgsql, redis
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json

      - name: Install dependencies
        working-directory: apps/platform
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Wire warranty end to end
        run: |
          python3 .github/scripts/p014-e-warranty-finalize.py
          python3 .github/scripts/p014-e-warranty-type-fix.py

      - name: Normalize source
        working-directory: apps/platform
        run: |
          npx prettier --write \
            resources/js/Components/FundRealizationStatusCard.vue \
            resources/js/Components/ProfessionalFundOrdersPanel.vue \
            resources/js/Components/AdminFundRealizations.vue
          ./vendor/bin/pint app/Modules/Funds app/Modules/Identity/Http/Controllers/Api/ProfessionalWorkspaceController.php tests/Feature/Funds/FundsRealizationTest.php

      - name: Validate frontend
        working-directory: apps/platform
        run: |
          npm run format:check
          npm run lint:check
          npm run types:check
          npm run build

      - name: Validate warranty and full Laravel suite
        working-directory: apps/platform
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: wasplex_test
          DB_USERNAME: wasplex
          DB_PASSWORD: wasplex_ci_only
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: |
          composer lint:check
          php artisan test tests/Feature/Funds/FundsRealizationTest.php
          composer test

      - name: Commit final warranty implementation
        run: |
          rm .github/workflows/p014-e-warranty-finalize.yml
          rm .github/scripts/p014-e-warranty-finalize.py
          rm .github/scripts/p014-e-warranty-type-fix.py
          git config user.name "zumradeals"
          git config user.email "zumradeals@gmail.com"
          git add -A
          git commit -m "feat(funds): finaliser garantie P014-E de bout en bout"
          git push origin HEAD:feat/p014-e-fonds-realisation
