name: p014-b-funds-ci

on:
  push:
    branches: [feat/p014-b-fonds-apport-ledger]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: wasplex_test
          POSTGRES_USER: wasplex
          POSTGRES_PASSWORD: wasplex_local_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wasplex"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p014-b-fonds-apport-ledger
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Wire P014-B visual surfaces
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('apps/platform/resources/js/Components/FundsPanel.vue')
          s = p.read_text()
          if "import FundBalanceCard from '@/Components/FundBalanceCard.vue';" not in s:
              s = s.replace(
                  "import http from '@/lib/http';\n",
                  "import http from '@/lib/http';\nimport FundBalanceCard from '@/Components/FundBalanceCard.vue';\nimport FundWishContribution from '@/Components/FundWishContribution.vue';\n",
              )
          if 'personal_contribution_minor: number;' not in s:
              s = s.replace(
                  "    required_personal_contribution_minor: number | null;\n    currency: string;",
                  "    required_personal_contribution_minor: number | null;\n    personal_contribution_minor: number;\n    personal_contribution_remaining_minor: number | null;\n    personal_contribution_progress_percent: number;\n    personal_contribution_completed_at: string | null;\n    personal_contributions: Array<{ id: string; source: 'wallet' | 'fund_balance'; amount_minor: number; created_at: string }>;\n    currency: string;",
              )
          if 'balances: {' not in s:
              s = s.replace(
                  "    membership: Membership | null;\n    programs: Program[];",
                  "    membership: Membership | null;\n    balances: { wallet_available_minor: number; fund_balance_minor: number; unit: string; wp_to_xof: number };\n    programs: Program[];",
              )
          if '<FundBalanceCard' not in s:
              s = s.replace(
                  '            <section v-if="wishes.length" class="flex flex-col gap-2.5">',
                  '            <FundBalanceCard v-if="activeMembership" :balances="data.balances" @refresh="load" />\n\n            <section v-if="wishes.length" class="flex flex-col gap-2.5">',
              )
          if '<FundWishContribution' not in s:
              s = s.replace(
                  '                    <p v-if="item.review_note" class="text-wpx-gold mt-2 text-xs">{{ item.review_note }}</p>',
                  '                    <FundWishContribution\n                        v-if="item.status !== \'draft\' && item.status !== \'rejected\'"\n                        :wish="item"\n                        :balances="data.balances"\n                        @refresh="load"\n                    />\n                    <p v-if="item.review_note" class="text-wpx-gold mt-2 text-xs">{{ item.review_note }}</p>',
              )
          p.write_text(s)

          p = Path('apps/platform/resources/js/Components/AdminFundsPanel.vue')
          s = p.read_text()
          if 'personal_contribution_progress_percent: number;' not in s:
              s = s.replace(
                  "    estimated_amount_minor: number | null;\n    currency: string;",
                  "    estimated_amount_minor: number | null;\n    required_personal_contribution_minor: number | null;\n    personal_contribution_minor: number;\n    personal_contribution_remaining_minor: number | null;\n    personal_contribution_progress_percent: number;\n    currency: string;",
              )
          s = s.replace(
              "    metrics: { active_programs: number; submitted_wishes: number; approved_wishes: number };",
              "    metrics: { active_programs: number; submitted_wishes: number; approved_wishes: number; personal_contributions_count: number; personal_contributions_minor: number };",
          )
          s = s.replace('            <section class="grid gap-3 sm:grid-cols-3">', '            <section class="grid gap-3 sm:grid-cols-4">', 1)
          if 'Apports personnels' not in s:
              marker = '''                <div class="bg-wpx-navy-850 border-wpx-border-dark rounded-xl border p-4">
                    <p class="text-wpx-muted-dark text-xs">Vœux validés</p>
                    <p class="text-wpx-success-light mt-2 text-2xl font-extrabold">
                        {{ dashboard.metrics.approved_wishes }}
                    </p>
                </div>'''
              extra = marker + '''
                <div class="bg-wpx-navy-850 border-wpx-border-dark rounded-xl border p-4">
                    <p class="text-wpx-muted-dark text-xs">Apports personnels</p>
                    <p class="text-wpx-cyan mt-2 text-2xl font-extrabold">
                        {{ money(dashboard.metrics.personal_contributions_minor) }}
                    </p>
                    <p class="text-wpx-muted-dark mt-1 text-[10px]">{{ dashboard.metrics.personal_contributions_count }} opération(s)</p>
                </div>'''
              s = s.replace(marker, extra)
          if 'Apport personnel constitué' not in s:
              old = '''                            <p v-if="wish.estimated_amount_minor" class="text-wpx-gold mt-2 text-sm font-bold">
                                {{ money(wish.estimated_amount_minor, wish.currency) }}
                            </p>'''
              new = old + '''
                            <div v-if="wish.required_personal_contribution_minor" class="mt-3 max-w-md">
                                <div class="flex justify-between text-[10px]">
                                    <span class="text-wpx-muted-dark">Apport personnel constitué</span>
                                    <span class="text-wpx-white-soft font-bold">{{ money(wish.personal_contribution_minor, wish.currency) }} / {{ money(wish.required_personal_contribution_minor, wish.currency) }}</span>
                                </div>
                                <div class="bg-wpx-navy-950 mt-1.5 h-1.5 overflow-hidden rounded-full">
                                    <div class="from-wpx-blue to-wpx-cyan h-full rounded-full bg-gradient-to-r" :style="{ width: `${wish.personal_contribution_progress_percent}%` }"></div>
                                </div>
                                <p class="text-wpx-muted-dark mt-1 text-[10px]">{{ wish.personal_contribution_progress_percent }}% · {{ money(wish.personal_contribution_remaining_minor, wish.currency) }} restant</p>
                            </div>'''
              s = s.replace(old, new)
          p.write_text(s)
          PY

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, redis
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json

      - name: Install dependencies
        working-directory: apps/platform
        run: |
          composer install --no-interaction --prefer-dist
          npm ci

      - name: Prepare environment
        working-directory: apps/platform
        run: |
          cp .env.example .env
          php artisan key:generate
          printf '\nDB_CONNECTION=pgsql\nDB_HOST=127.0.0.1\nDB_PORT=5432\nDB_DATABASE=wasplex_test\nDB_USERNAME=wasplex\nDB_PASSWORD=wasplex_local_only\nREDIS_HOST=127.0.0.1\nREDIS_PORT=6379\n' >> .env

      - name: Format implementation
        working-directory: apps/platform
        run: |
          npx prettier --write resources/js/Components/FundsPanel.vue resources/js/Components/FundBalanceCard.vue resources/js/Components/FundWishContribution.vue resources/js/Components/AdminFundsPanel.vue
          ./vendor/bin/pint

      - name: Frontend checks
        working-directory: apps/platform
        run: |
          npm run format:check
          npm run lint:check
          npm run types:check
          npm run build

      - name: P014-B tests
        working-directory: apps/platform
        run: |
          composer lint:check
          php artisan config:clear
          php artisan test tests/Feature/Funds/FundsPersonalContributionTest.php

      - name: Full Laravel suite
        working-directory: apps/platform
        run: php artisan test --stop-on-failure

      - name: Commit formatted implementation and cleanup
        run: |
          rm .github/workflows/p014-b-funds-ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat(funds): finaliser P014-B apport personnel et Ledger"
          git push origin HEAD:feat/p014-b-fonds-apport-ledger
