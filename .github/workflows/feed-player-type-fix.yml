name: feed-player-type-fix

on:
  push:
    branches:
      - feat/feed-video-player

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json
      - run: npm ci
      - name: Apply null-safe delivery snapshots
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('resources/js/Components/FeedPanel.vue')
          text = path.read_text()
          text = text.replace(
              "        delivery.value = { ...delivery.value, ...data.delivery };\n\n        if (delivery.value.progress_percent >= 100) {",
              "        const updated = { ...delivery.value, ...data.delivery };\n        delivery.value = updated;\n\n        if (updated.progress_percent >= 100) {",
              1,
          )
          text = text.replace(
              "        delivery.value = { ...delivery.value, ...data.delivery };\n        void prefetchNext();\n\n        if (delivery.value.status === 'held') {",
              "        const updated = { ...delivery.value, ...data.delivery };\n        delivery.value = updated;\n        void prefetchNext();\n\n        if (updated.status === 'held') {",
              1,
          )
          path.write_text(text)
          PY
          npx prettier --write resources/js/Components/FeedPanel.vue
          npm run types:check
      - name: Commit FeedPanel only
        run: |
          if git diff --quiet -- resources/js/Components/FeedPanel.vue; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/Components/FeedPanel.vue
          git commit -m "fix(feed): keep delivery snapshots type-safe"
          git push origin HEAD:feat/feed-video-player
