name: p016-wire-health

on:
  push:
    branches:
      - feat/p016-a-sante-citoyen-capsule
    paths:
      - .github/workflows/p016-wire-health.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p016-a-sante-citoyen-capsule
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json
      - name: Replace scoped apply utility
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path("apps/platform/resources/js/Components/HealthPanel.vue")
          s = p.read_text()
          utilities = "bg-wpx-navy-950 border-wpx-border-dark text-wpx-white-soft placeholder:text-wpx-muted-dark w-full rounded-xl border px-3 py-3 text-xs outline-none"
          s = s.replace('class="health-input"', f'class="{utilities}"')
          start = s.find("\n<style scoped>\n")
          if start != -1:
              end = s.find("</style>", start)
              if end == -1:
                  raise SystemExit("style block end not found")
              s = s[:start] + "\n" + s[end + len("</style>"):]
          p.write_text(s)
          PY
      - name: Format HealthPanel
        working-directory: apps/platform
        run: |
          npm ci
          npx prettier --write resources/js/Components/HealthPanel.vue
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/platform/resources/js/Components/HealthPanel.vue
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(health): éviter @apply dans le style scoped"
          git push origin HEAD:feat/p016-a-sante-citoyen-capsule
