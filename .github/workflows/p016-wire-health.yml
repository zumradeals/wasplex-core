name: p016-wire-health

on:
  push:
    branches:
      - feat/p016-a-sante-citoyen-capsule
    paths:
      - .github/workflows/p016-wire-health.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p016-a-sante-citoyen-capsule
          fetch-depth: 0
      - name: Wire HealthPanel into AlertsPanel
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path("apps/platform/resources/js/Components/AlertsPanel.vue")
          s = p.read_text()
          marker = "import http from '@/lib/http';"
          health_import = "import HealthPanel from '@/Components/HealthPanel.vue';"
          if health_import not in s:
              s = s.replace(marker, marker + "\n" + health_import)
          start = s.index("        <template v-else-if=\"activeTab === 'health'\">")
          end = s.index("        <template v-else>", start)
          replacement = "        <template v-else-if=\"activeTab === 'health'\">\n            <HealthPanel />\n        </template>\n\n"
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          PY
      - name: Commit wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/platform/resources/js/Components/AlertsPanel.vue
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(health): raccorder Ma Santé dans Alertes"
          git push origin HEAD:feat/p016-a-sante-citoyen-capsule
