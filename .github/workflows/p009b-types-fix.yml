name: p009b-types-fix

on:
  pull_request:
    paths:
      - ".github/workflows/p009b-types-fix.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true

      - name: Apply strict type fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          service = Path('apps/platform/app/Modules/Distribution/Application/Services/AdvertisingDeliveryService.php')
          text = service.read_text()
          old = "$windowStartTimestamp = intdiv($now->timestamp, $windowSeconds) * $windowSeconds;"
          new = "$windowStartTimestamp = intdiv((int) $now->timestamp, $windowSeconds) * $windowSeconds;"
          if old not in text:
              raise SystemExit('service pattern not found')
          service.write_text(text.replace(old, new, 1))

          controller = Path('apps/platform/app/Modules/Distribution/Http/Controllers/AdvertisingDeliveryController.php')
          text = controller.read_text()
          old = """        $key = trim((string) $request->header(\n            'Idempotency-Key',\n            $request->input('idempotency_key', ''),\n        ));"""
          new = """        $header = $request->header('Idempotency-Key');\n        $input = $request->input('idempotency_key');\n        $key = trim(is_string($header) ? $header : (is_string($input) ? $input : ''));"""
          if old not in text:
              raise SystemExit('controller pattern not found')
          controller.write_text(text.replace(old, new, 1))
          PY

      - name: Commit strict type fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/platform/app/Modules/Distribution/Application/Services/AdvertisingDeliveryService.php apps/platform/app/Modules/Distribution/Http/Controllers/AdvertisingDeliveryController.php
          git commit -m "fix(distribution): normalize strict delivery types"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
