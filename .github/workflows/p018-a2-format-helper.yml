name: p018-a2-format-helper

on:
  push:
    branches:
      - feat/p018-a2-realtime-live

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Format P018-A.2 frontend
        run: npm run format
      - name: Commit exact formatter output and remove helper
        shell: bash
        working-directory: .
        run: |
          rm .github/workflows/p018-a2-format-helper.yml
          git config user.name "zumradeals"
          git config user.email "zumradeals@gmail.com"
          git add -- apps/platform/resources/js/Components/AdvertiserLivePanel.vue \
            apps/platform/resources/js/Components/LivePanel.vue \
            apps/platform/resources/js/Components/LiveRealtimeRoom.vue \
            .github/workflows/p018-a2-format-helper.yml
          git commit -m "fix(P018-A.2): appliquer le formatage frontend CI"
          git push origin HEAD:feat/p018-a2-realtime-live
