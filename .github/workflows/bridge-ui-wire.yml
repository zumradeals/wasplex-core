name: bridge-ui-wire

on:
  push:
    branches:
      - feat/p015-p016-p019-institutional-bridges
    paths:
      - .github/workflows/bridge-ui-wire.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p015-p016-p019-institutional-bridges
          fetch-depth: 0
      - name: Wire institutional cases panel
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('apps/platform/resources/js/Pages/Identity/ProfessionalShell.vue')
          s = path.read_text()
          imp = "import ProfessionalInstitutionalCasesPanel from '@/Components/ProfessionalInstitutionalCasesPanel.vue';"
          if imp not in s:
              s = s.replace(
                  "import SpaceSwitcher from '@/Components/SpaceSwitcher.vue';",
                  "import SpaceSwitcher from '@/Components/SpaceSwitcher.vue';\n" + imp,
              )
          marker = '''                    <section\n                        v-else-if="activeTab === 'team'"'''
          insert = '''                    <ProfessionalInstitutionalCasesPanel\n                        v-else-if="activeTab === 'cases'"\n                        :space-kind="workspace.space.space_kind"\n                    />\n\n'''
          if insert.strip() not in s:
              s = s.replace(marker, insert + marker)
          s = s.replace(
              "L’espace est prêt à recevoir les projections institutionnelles. Aucun signalement n’est affiché tant que le raccordement P015 institutionnel n’est pas activé.",
              "Les signalements explicitement transmis à votre organisation apparaissent dans Dossiers. Une prise en charge n’existe qu’après votre action réelle et horodatée.",
          )
          s = s.replace(
              "L’espace est prêt pour les accès Santé autorisés. Aucun dossier médical n’est ouvert automatiquement et aucune capsule n’est consultable sans le flux d’autorisation prévu.",
              "Les demandes d’accès Santé passent par Dossiers. Le patient garde la décision pour l’accès normal et l’urgence exige son consentement d’urgence actif.",
          )
          path.write_text(s)
          PY
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/platform/resources/js/Pages/Identity/ProfessionalShell.vue
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(pro): raccorder les dossiers Alertes et Santé"
          git push origin HEAD:feat/p015-p016-p019-institutional-bridges
