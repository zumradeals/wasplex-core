name: bridge-ui-wire

on:
  push:
    branches:
      - feat/p015-p016-p019-institutional-bridges
    paths:
      - .github/workflows/bridge-ui-wire.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p015-p016-p019-institutional-bridges
          fetch-depth: 0
      - name: Wire institutional UI
        run: |
          python3 <<'PY'
          from pathlib import Path

          pro = Path('apps/platform/resources/js/Pages/Identity/ProfessionalShell.vue')
          s = pro.read_text()
          imp = "import ProfessionalInstitutionalCasesPanel from '@/Components/ProfessionalInstitutionalCasesPanel.vue';"
          if imp not in s:
              s = s.replace(
                  "import SpaceSwitcher from '@/Components/SpaceSwitcher.vue';",
                  "import SpaceSwitcher from '@/Components/SpaceSwitcher.vue';\n" + imp,
              )
          marker = '''                    <section\n                        v-else-if="activeTab === 'team'"'''
          insert = '''                    <ProfessionalInstitutionalCasesPanel\n                        v-else-if="activeTab === 'cases'"\n                        :space-kind="workspace.space.space_kind"\n                    />\n\n'''
          if insert.strip() not in s:
              s = s.replace(marker, insert + marker)
          s = s.replace(
              "L’espace est prêt à recevoir les projections institutionnelles. Aucun signalement n’est affiché tant que le raccordement P015 institutionnel n’est pas activé.",
              "Les signalements explicitement transmis à votre organisation apparaissent dans Dossiers. Une prise en charge n’existe qu’après votre action réelle et horodatée.",
          )
          s = s.replace(
              "L’espace est prêt pour les accès Santé autorisés. Aucun dossier médical n’est ouvert automatiquement et aucune capsule n’est consultable sans le flux d’autorisation prévu.",
              "Les demandes d’accès Santé passent par Dossiers. Le patient garde la décision pour l’accès normal et l’urgence exige son consentement d’urgence actif.",
          )
          pro.write_text(s)

          health = Path('apps/platform/resources/js/Components/HealthPanel.vue')
          s = health.read_text()
          health_imp = "import HealthProfessionalAccessRequestsPanel from '@/Components/HealthProfessionalAccessRequestsPanel.vue';"
          if health_imp not in s:
              last_import = "import http from '@/lib/http';"
              s = s.replace(last_import, last_import + "\n" + health_imp)
          needle = '''            <div v-else-if="activeTab === 'accesses'"'''
          replacement = '''            <div v-else-if="activeTab === 'accesses'">\n                <HealthProfessionalAccessRequestsPanel />\n                <div'''
          if '<HealthProfessionalAccessRequestsPanel />' not in s:
              s = s.replace(needle, replacement, 1)
          health.write_text(s)
          PY
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/platform/resources/js/Pages/Identity/ProfessionalShell.vue \
            apps/platform/resources/js/Components/HealthPanel.vue
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(ui): raccorder les dossiers institutionnels et les demandes Santé"
          git push origin HEAD:feat/p015-p016-p019-institutional-bridges
