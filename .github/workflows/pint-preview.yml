name: pint-preview

on:
  pull_request:

permissions:
  contents: read

jobs:
  preview:
    if: github.head_ref == 'codex/admin-geniuspay-configuration'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Format target files and print diff
        run: |
          vendor/bin/pint \
            app/Modules/Wallet/Application/Services/GeniusPayConfigurationService.php \
            app/Modules/Wallet/Infrastructure/Payments/GeniusPayGateway.php
          git diff -- \
            app/Modules/Wallet/Application/Services/GeniusPayConfigurationService.php \
            app/Modules/Wallet/Infrastructure/Payments/GeniusPayGateway.php
