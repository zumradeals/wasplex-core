name: feed-player-format-debug

on:
  push:
    branches:
      - feat/feed-video-player

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json
      - run: npm ci
      - name: Format FeedPanel
        run: npx prettier --write resources/js/Components/FeedPanel.vue
      - name: Stage formatted file
        run: |
          mkdir -p /tmp/feed-player-format
          cp resources/js/Components/FeedPanel.vue /tmp/feed-player-format/FeedPanel.vue
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-feed-panel
          path: /tmp/feed-player-format/FeedPanel.vue
          if-no-files-found: error
