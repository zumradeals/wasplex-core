name: feed-player-format-debug

on:
  push:
    branches:
      - feat/feed-video-player

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json
      - run: npm ci
      - name: Format FeedPanel
        run: npx prettier --write resources/js/Components/FeedPanel.vue
      - name: Emit formatted FeedPanel
        run: base64 -w 0 resources/js/Components/FeedPanel.vue
