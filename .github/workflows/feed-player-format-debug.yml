name: feed-player-format-debug

on:
  push:
    branches:
      - feat/feed-video-player

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json
      - run: npm ci
      - name: Format FeedPanel only
        run: npx prettier --write resources/js/Components/FeedPanel.vue
      - name: Commit formatted FeedPanel only
        run: |
          if git diff --quiet -- resources/js/Components/FeedPanel.vue; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/Components/FeedPanel.vue
          git commit -m "style(feed): format video player"
          git push origin HEAD:feat/feed-video-player
