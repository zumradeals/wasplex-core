name: format-preview

on:
  push:
    branches:
      - feat/mon-espace-identity-security

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json
      - run: npm ci
      - name: Apply Prettier
        run: npx prettier --write resources/js/Components/AccountSecurityPanel.vue resources/js/Components/IdentityVerificationPanel.vue resources/js/Pages/Identity/UserShell.vue
      - name: Commit exact formatting when needed
        working-directory: .
        run: |
          if git diff --quiet -- apps/platform/resources/js/Components/AccountSecurityPanel.vue apps/platform/resources/js/Components/IdentityVerificationPanel.vue apps/platform/resources/js/Pages/Identity/UserShell.vue; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "wasplex-ci"
          git config user.email "wasplex-ci@users.noreply.github.com"
          git add -- apps/platform/resources/js/Components/AccountSecurityPanel.vue apps/platform/resources/js/Components/IdentityVerificationPanel.vue apps/platform/resources/js/Pages/Identity/UserShell.vue
          git commit -m "style: formater les panneaux Mon Espace"
          git push origin HEAD:feat/mon-espace-identity-security
