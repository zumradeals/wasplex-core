name: format-preview

on:
  push:
    branches:
      - feat/mon-espace-identity-security

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json
      - run: npm ci
      - name: Format target files
        run: npx prettier --write resources/js/Components/AccountSecurityPanel.vue resources/js/Components/IdentityVerificationPanel.vue resources/js/Pages/Identity/UserShell.vue
      - name: Print formatted files as base64
        run: |
          for file in resources/js/Components/AccountSecurityPanel.vue resources/js/Components/IdentityVerificationPanel.vue resources/js/Pages/Identity/UserShell.vue; do
            echo "===== FILE:$file ====="
            base64 -w0 "$file"
            echo
            echo "===== END:$file ====="
          done
