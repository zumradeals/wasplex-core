name: p009c-format

on:
  push:
    branches:
      - agent/p009c-user-feed-player

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout P009-C branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/p009c-user-feed-player

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json

      - name: Strengthen visibility confirmation guard
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/platform/resources/js/pages/User/Feed.vue')
          text = path.read_text()
          old_ready = """const mediaReady = async () => {
              clearMediaTimer();
              await confirmCurrent();
          };
          """
          new_ready = """const mediaReady = async () => {
              clearMediaTimer();

              if (document.hidden) {
                  state.value = 'paused';
                  return;
              }

              await confirmCurrent();
          };
          """
          old_visibility = """const onVisibilityChange = () => {
              if (!video.value || delivery.value?.creative_type !== 'video') {
                  return;
              }

              if (document.hidden) {
                  video.value.pause();
                  if (state.value === 'active') {
                      state.value = 'paused';
                  }
              } else if (state.value === 'paused') {
                  state.value = 'active';
                  void video.value.play().catch(() => {
                      autoplayBlocked.value = true;
                  });
              }
          };
          """
          new_visibility = """const onVisibilityChange = () => {
              if (document.hidden) {
                  video.value?.pause();
                  if (delivery.value && ['prepared', 'delivered'].includes(delivery.value.status)) {
                      state.value = 'paused';
                  }
                  return;
              }

              if (delivery.value?.status === 'prepared' && state.value === 'paused') {
                  void confirmCurrent();
                  return;
              }

              if (delivery.value?.creative_type === 'video' && video.value && state.value === 'paused') {
                  state.value = 'active';
                  void video.value.play().catch(() => {
                      autoplayBlocked.value = true;
                  });
              }
          };
          """
          if old_ready not in text or old_visibility not in text:
              raise SystemExit('Expected P009-C snippets were not found.')
          path.write_text(text.replace(old_ready, new_ready).replace(old_visibility, new_visibility))
          PY

      - name: Install frontend dependencies
        working-directory: apps/platform
        run: npm ci

      - name: Format frontend
        working-directory: apps/platform
        run: npm run format

      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            echo "No formatting change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/platform/resources
          git commit -m "style(feed): format P009-C player"
          git push origin HEAD:agent/p009c-user-feed-player
